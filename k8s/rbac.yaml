apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-pacman
  namespace: kube-pacman
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-pacman-pod-chaos
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-pacman-pod-chaos
  namespace: default
subjects:
  - kind: ServiceAccount
    name: kube-pacman
    namespace: kube-pacman
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-pacman-pod-chaos
