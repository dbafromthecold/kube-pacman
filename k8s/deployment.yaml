apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-pacman
  namespace: kube-pacman
  labels:
    app.kubernetes.io/name: kube-pacman
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-pacman
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-pacman
    spec:
      serviceAccountName: kube-pacman
      containers:
        - name: kube-pacman
          image: kube-pacman:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: APP_VERSION
              value: "1.0.0"
            - name: CHAOS_ENABLED
              value: "true"
            - name: TARGET_NAMESPACE
              value: "default"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
